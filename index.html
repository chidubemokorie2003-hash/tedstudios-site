<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TEDSTUDIOS</title>
<script src="https://js.paystack.co/v1/inline.js"></script>

<style>
body {
  background: #000;
  color: #fff;
  font-family: Arial;
  text-align: center;
  padding: 20px;
}

h1 { font-size: 40px; }

.subtitle {
  color: #aaa;
  margin-bottom: 30px;
}

.card {
  border: 1px solid #333;
  padding: 25px;
  margin: 20px auto;
  width: 320px;
  border-radius: 15px;
}

.price { font-size: 22px; }
.naira { color: #aaa; font-size: 14px; }

button {
  margin-top: 10px;
  padding: 10px 20px;
  border-radius: 10px;
  background: #fff;
  color: #000;
  cursor: pointer;
}

.small { font-size: 13px; color: #aaa; }

/* MODAL */
#paymentModal {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.85);
  justify-content: center;
  align-items: center;
}

.modal-box {
  background: #111;
  padding: 30px;
  border-radius: 15px;
  width: 300px;
}

input, select {
  width: 90%;
  padding: 10px;
  border-radius: 8px;
  border: none;
  margin-top: 10px;
}
</style>
</head>

<body>

<h1>TEDSTUDIOS</h1>
<p class="subtitle">Your middleman to strong and reliable proxies</p>

<div class="card">
  <h2>Static Proxy</h2>
  <p>$13 / ₦19,500</p>
  <button onclick="openPayment(19500, 1300)">Buy Now</button>
</div>

<div class="card">
  <h2>ISP Proxy</h2>
  <p>$15 / ₦22,500</p>
  <button onclick="openPayment(22500, 1500)">Buy Now</button>
</div>

<div class="card">
  <h2>Residential Proxies</h2>

  <p class="small">As-You-Go</p>
  <p>$16 / ₦24,000</p>
  <button onclick="openPayment(24000, 1600)">Buy Now</button>

  <hr>

  <p class="small">TedDouble</p>
  <p>$26 / ₦39,000</p>
  <button onclick="openPayment(39000, 2600)">Buy Now</button>

  <p class="small">TedStable</p>
  <p>$31 / ₦46,500</p>
  <button onclick="openPayment(46500, 3100)">Buy Now</button>

  <p class="small">TedBeta</p>
  <p>$60 / ₦90,000</p>
  <button onclick="openPayment(90000, 6000)">Buy Now</button>
</div>

<div class="card">
  <h2>Mobile Proxy</h2>
  <button onclick="contact()">Request Access</button>
</div>

<div class="card">
  <h2>Bulk Orders</h2>
  <button onclick="contact()">Contact for Bulk</button>
</div>

<!-- MODAL -->
<div id="paymentModal">
  <div class="modal-box">
    <h3>Enter your details</h3>

    <input type="email" id="userEmail" placeholder="your@email.com">
    <select id="userCountry"></select>

    <br><br>
    <button onclick="startPayment()">Continue</button>
    <br><br>
    <button onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
let selectedNGN = 0;
let selectedUSD = 0;
let detectedCurrency = "NGN";

// 🌍 Detect country
fetch("https://ipapi.co/json/")
.then(res => res.json())
.then(data => {
  if (data.country !== "NG") detectedCurrency = "USD";
})
.catch(()=>{});

function openPayment(ngn, usd) {
  selectedNGN = ngn;
  selectedUSD = usd;
  document.getElementById("paymentModal").style.display = "flex";
}

function closeModal() {
  document.getElementById("paymentModal").style.display = "none";
}

// Countries
const countries = ["Nigeria","United States","United Kingdom","Canada","Germany","France","India","South Africa"];
const select = document.getElementById("userCountry");

let defaultOption = document.createElement("option");
defaultOption.text = "Select Proxy Location";
defaultOption.value = "";
select.appendChild(defaultOption);

countries.forEach(c => {
  let o = document.createElement("option");
  o.value = c;
  o.text = c;
  select.appendChild(o);
});

function startPayment() {
  let email = document.getElementById("userEmail").value;
  let country = document.getElementById("userCountry").value;

  if (!email || !email.includes("@")) {
    alert("Enter a valid email");
    return;
  }

  if (!country) {
    alert("Select a country");
    return;
  }

  let currency = detectedCurrency;
  let amount = currency === "USD" ? selectedUSD : selectedNGN;

  PaystackPop.setup({
    key: 'pk_live_a7913069a5ddd9b4621a9cd4590ac1fdf806fd54',
    email: email,
    amount: amount,
    currency: currency,

    metadata: {
      custom_fields: [{
        display_name: "Proxy Country",
        value: country
      }]
    },

    callback: function() {
      closeModal();
      window.location.href = "/thank-you.html";
    },

    onClose: closeModal
  }).openIframe();
}

function contact() {
  window.location.href = "https://wa.me/2349046969917";
}
</script>

</body>
</html>
