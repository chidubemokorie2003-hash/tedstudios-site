<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TEDSTUDIOS - Proxies</title>

  <script src="https://js.paystack.co/v1/inline.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #000;
      color: #fff;
      text-align: center;
      padding: 30px;
    }

    h1 {
      color: #00ffcc;
    }

    input {
      width: 80%;
      padding: 10px;
      margin: 20px 0;
      border-radius: 5px;
      border: none;
    }

    .card {
      border: 1px solid #333;
      padding: 20px;
      margin: 20px auto;
      max-width: 400px;
      border-radius: 10px;
      background: #111;
    }

    button {
      margin-top: 10px;
      padding: 10px 15px;
      background: #00ffcc;
      color: #000;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #00cc99;
    }
  </style>
</head>

<body>

  <h1>Buy Proxies</h1>

  <!-- Email input -->
  <input type="email" id="email" placeholder="Enter your email" required>

  <!-- ISP Proxy -->
  <div class="card">
    <h2>ISP Proxy</h2>
    <p>₦5000</p>
    <button onclick="payWithPaystack(500000, 'ISP Proxy')">Buy Now</button>
  </div>

  <!-- Residential 1–7 Days -->
  <div class="card">
    <h2>Residential (1–7 Days)</h2>
    <p>₦3000</p>
    <button onclick="payWithPaystack(300000, 'Residential 1-7 Days')">Buy Now</button>
  </div>

  <!-- Residential 2 Weeks -->
  <div class="card">
    <h2>Residential (2 Weeks)</h2>
    <p>₦6000</p>
    <button onclick="payWithPaystack(600000, 'Residential 2 Weeks')">Buy Now</button>
  </div>

  <!-- Residential 1 Month -->
  <div class="card">
    <h2>Residential (1 Month)</h2>
    <p>₦10000</p>
    <button onclick="payWithPaystack(1000000, 'Residential 1 Month')">Buy Now</button>
  </div>

<script>
function payWithPaystack(amount, plan) {
  let email = document.getElementById("email").value;

  if (!email) {
    alert("Please enter your email");
    return;
  }

  let handler = PaystackPop.setup({
    key: 'pk_live_a7913069a5ddd9b4621a9cd4590ac1fdf806fd54',
    email: email,
    amount: amount,

    metadata: {
      custom_fields: [
        {
          display_name: "Plan",
          variable_name: "plan",
          value: plan
        }
      ]
    },

    callback: function(response) {
      window.location.href = "/thank-you.html";
    },

    onClose: function() {
      alert('Transaction cancelled');
    }
  });

  handler.openIframe();
}
</script>

</body>
</html>
