<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TEDSTUDIOS - Proxies</title>

  <!-- Paystack -->
  <script src="https://js.paystack.co/v1/inline.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      text-align: center;
      padding: 30px;
    }

    h1 {
      color: #00ffcc;
      margin-bottom: 5px;
    }

    .tagline {
      color: #ccc;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .card {
      border: 1px solid #333;
      border-radius: 10px;
      padding: 25px;
      margin: 20px auto;
      max-width: 400px;
      background: #111;
    }

    .card h2 {
      margin-bottom: 10px;
    }

    .price {
      margin: 10px 0;
      font-size: 18px;
      color: #ccc;
    }

    button {
      margin-top: 10px;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      background: #00ffcc;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #00cc99;
    }
  </style>
</head>

<body>

  <h1>Buy Proxies</h1>
  <div class="tagline">Vendor for all moderating accounts</div>

  <!-- ISP Proxy -->
  <div class="card">
    <h2>ISP Proxy</h2>
    <div class="price">₦5000</div>
    <button onclick="startPayment(500000, 'ISP Proxy')">Buy Now</button>
  </div>

  <!-- Residential (1–7 Days) -->
  <div class="card">
    <h2>Residential (1–7 Days)</h2>
    <div class="price">₦3000</div>
    <button onclick="startPayment(300000, 'Residential 1-7 Days')">Buy Now</button>
  </div>

  <!-- Residential (2 Weeks) -->
  <div class="card">
    <h2>Residential (2 Weeks)</h2>
    <div class="price">₦6000</div>
    <button onclick="startPayment(600000, 'Residential 2 Weeks')">Buy Now</button>
  </div>

  <!-- Residential (1 Month) -->
  <div class="card">
    <h2>Residential (1 Month)</h2>
    <div class="price">₦10000</div>
    <button onclick="startPayment(1000000, 'Residential 1 Month')">Buy Now</button>
  </div>

<script>
function startPayment(amount, plan) {
  let email = prompt("Enter your email:");

  if (!email) {
    alert("Email is required");
    return;
  }

  let handler = PaystackPop.setup({
    key: 'pk_live_a7913069a5ddd9b4621a9cd4590ac1fdf806fd54',
    email: email,
    amount: amount,

    metadata: {
      custom_fields: [
        {
          display_name: "Plan",
          variable_name: "plan",
          value: plan
        }
      ]
    },

    callback: function(response) {
      window.location.href = "/thank-you.html";
    },

    onClose: function() {
      alert('Transaction cancelled');
    }
  });

  handler.openIframe();
}
</script>

</body>
</html>
