<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TEDSTUDIOS - Buy Proxy</title>

  <!-- Paystack Script -->
  <script src="https://js.paystack.co/v1/inline.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      text-align: center;
      padding: 50px;
    }

    .box {
      max-width: 400px;
      margin: auto;
      border: 1px solid #333;
      padding: 30px;
      border-radius: 10px;
      background: #111;
    }

    h1 {
      color: #00ffcc;
    }

    input {
      width: 90%;
      padding: 10px;
      margin-top: 15px;
      border-radius: 5px;
      border: none;
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      background: #00ffcc;
      color: #000;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #00cc99;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Buy Proxy</h1>
    <p>Fast & Reliable Proxies - TEDSTUDIOS</p>

    <!-- Email -->
    <input type="email" id="email" placeholder="Enter your email" required>

    <!-- Button -->
    <button onclick="payWithPaystack()">
      Buy Now - ₦5000
    </button>
  </div>

  <script>
    function payWithPaystack() {
      let email = document.getElementById("email").value;

      if (!email) {
        alert("Please enter your email");
        return;
      }

      let handler = PaystackPop.setup({
        key: 'pk_live_a7913069a5ddd9b4621a9cd4590ac1fdf806fd54',
        email: email,
        amount: 500000, // ₦5000

        callback: function(response) {
          // Redirect after successful payment
          window.location.href = "/thank-you.html";
        },

        onClose: function() {
          alert('Transaction cancelled');
        }
      });

      handler.openIframe();
    }
  </script>

</body>
</html>
